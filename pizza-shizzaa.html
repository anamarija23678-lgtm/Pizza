<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍕 Pizza Shizzaa!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a0a00;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    overflow: hidden;
  }
  #wrap {
    width: 480px;
    max-width: 100vw;
    background: #FF6B35;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    position: relative;
  }
  #gh {
    background: #FF6B35;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sb {
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    padding: 5px 14px;
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    min-width: 80px;
    text-align: center;
  }
  #gtitle {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.25);
  }
  canvas {
    display: block;
    width: 100%;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FF6B35;
    z-index: 10;
    padding: 20px;
  }
  .btitle {
    font-size: clamp(30px, 8vw, 52px);
    font-weight: 900;
    color: #fff;
    text-shadow: 3px 3px 0 #9e2e00;
    margin: 0 0 8px;
    text-align: center;
  }
  .sub { color: #ffd0b5; font-size: 17px; margin: 5px 0; text-align: center; }
  .hint { color: rgba(255,255,255,0.8); font-size: 13px; margin: 3px 0; text-align: center; }
  .legend {
    display: flex;
    gap: 20px;
    margin: 12px 0;
    font-size: 14px;
    color: #fff;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .gbtn {
    background: #FFD700;
    color: #7a3800;
    border: none;
    border-radius: 50px;
    padding: 14px 44px;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    margin-top: 16px;
    box-shadow: 0 5px 0 #b8860b;
    transition: transform .1s, box-shadow .1s;
    outline: none;
  }
  .gbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
  .gbtn:hover { background: #ffe233; }
  #hs-row { color: #ffe8d6; font-size: 15px; margin-top: 8px; }
</style>
</head>
<body>
<div id="wrap">

  <!-- Title screen -->
  <div class="overlay" id="ts">
    <div class="btitle">🍕 PIZZA SHIZZAA!</div>
    <div class="sub">Uhvati <strong>sastojke</strong> za pizzu!</div>
    <div class="sub">Izbjegavaj <strong>bube i smeće</strong> — to kažnjava! 🪲💩</div>
    <div class="legend">
      <div class="leg-item"><div class="dot" style="background:#E8150A"></div> Dobro</div>
      <div class="leg-item"><div class="dot" style="background:#1F6B00"></div> Loše!</div>
    </div>
    <div class="hint">← → tipke &nbsp;|&nbsp; miš &nbsp;|&nbsp; dodir prsta</div>
    <button class="gbtn" onclick="startGame()">IGRAJ! 🎮</button>
    <div id="hs-row"></div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="gos" style="display:none">
    <div class="btitle">GAME OVER! 😢</div>
    <div id="fs" style="color:#ffe8d6;font-size:28px;margin:10px 0;font-weight:900;"></div>
    <div id="ghs" style="color:#ffd0b5;font-size:18px;margin:4px 0;"></div>
    <button class="gbtn" onclick="startGame()">OPET! 🔄</button>
  </div>

  <!-- Header -->
  <div id="gh">
    <div class="sb">⭐ <span id="sd">0</span></div>
    <div id="gtitle">PIZZA SHIZZAA</div>
    <div class="sb" id="ld">❤️❤️❤️❤️❤️</div>
  </div>

  <canvas id="gc" height="460"></canvas>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.parentElement.offsetWidth;
  canvas.width = W;
  H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

// ── Items ─────────────────────────────────────────────────────────────────────
const GOODS = [
  { e:'🍅', p:10,  bg:'#D41008', ring:'#FF5040' },
  { e:'🧀', p:10,  bg:'#E09500', ring:'#FFD030' },
  { e:'🍄', p:15,  bg:'#7B3200', ring:'#C86030' },
  { e:'🫑', p:15,  bg:'#157A12', ring:'#42D83E' },
  { e:'🥩', p:20,  bg:'#B50D08', ring:'#FF5050' },
  { e:'🫒', p:20,  bg:'#174D14', ring:'#3D9938' },
  { e:'🌶️', p:25, bg:'#C50800', ring:'#FF4422' },
  { e:'🦐', p:25,  bg:'#D05020', ring:'#FF9060' },
];
const BADS = [
  { e:'🪲', p:-1, bg:'#0D5500', ring:'#3BAA00' },
  { e:'💩', p:-1, bg:'#4A2800', ring:'#906040' },
];

// ── Game state ────────────────────────────────────────────────────────────────
let score, lives, items, trayX, running, speed, frame, popups, highScore=0, shake=0;

const TW=120, TH=22, TY_OFF=40, IR=26;
const MAX_LIVES = 5;

function trayY() { return H - TY_OFF; }

function startGame() {
  document.getElementById('ts').style.display = 'none';
  document.getElementById('gos').style.display = 'none';
  score=0; lives=MAX_LIVES; items=[]; trayX=W/2;
  running=true; speed=1.1; frame=0; popups=[]; shake=0;
  updateUI();
  requestAnimationFrame(loop);
}

function updateUI() {
  document.getElementById('sd').textContent = score;
  document.getElementById('ld').textContent = '❤️'.repeat(Math.max(0, lives));
}

function spawn() {
  const bad = Math.random() < 0.13;
  const pool = bad ? BADS : GOODS;
  const t = pool[Math.floor(Math.random() * pool.length)];
  items.push({
    x: IR+14 + Math.random() * (W - IR*2 - 28),
    y: -IR,
    vy: speed + Math.random() * 0.9,
    e:t.e, p:t.p, bg:t.bg, ring:t.ring,
    w: Math.random() * Math.PI * 2,
    caught:false, alpha:1, scale:1
  });
}

function popup(x, y, txt, col) {
  popups.push({ x, y, txt, col, life:70 });
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
  if (!running) return;
  frame++;

  // Very gentle speed ramp: +0.10 every ~12 sec
  if (frame % 720 === 0 && speed < 5.2) speed += 0.10;

  // Spawn rate loosens slowly with speed
  const spawnRate = Math.max(60 - Math.floor(speed * 9), 24);
  if (frame % spawnRate === 0) spawn();

  if (shake > 0) shake--;
  const ox = shake > 0 ? (Math.random()-0.5)*shake*2.5 : 0;
  const oy = shake > 0 ? (Math.random()-0.5)*shake : 0;
  ctx.save();
  ctx.translate(ox, oy);

  // Background
  ctx.fillStyle = '#FFEFC7';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = '#FFD98A';
  ctx.lineWidth = 1;
  for (let yy=44; yy<H; yy+=44) {
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
  }

  const ty = trayY();

  // Tray shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(trayX, ty+17, TW/2+8, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Tray outer (wood dark)
  ctx.fillStyle = '#4A1E00';
  roundRect(ctx, trayX-TW/2-9, ty-TH/2+6, TW+18, TH+9, 11);
  ctx.fill();
  // Tray surface
  ctx.fillStyle = '#C25018';
  roundRect(ctx, trayX-TW/2, ty-TH/2, TW, TH, 8);
  ctx.fill();
  // Highlight stripe
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  roundRect(ctx, trayX-TW/2+8, ty-TH/2+4, TW-16, 6, 3);
  ctx.fill();

  // Items
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i=items.length-1; i>=0; i--) {
    const it = items[i];

    if (!it.caught) {
      it.y += it.vy;
      it.w += 0.055;
      const wx = Math.sin(it.w) * 5;
      const dx = it.x + wx;

      // Catch detection
      if (
        it.y + IR >= ty - TH/2 &&
        it.y - IR <  ty + TH/2 &&
        dx > trayX - TW/2 &&
        dx < trayX + TW/2
      ) {
        it.caught = true;
        if (it.p > 0) {
          // Good item caught ✓
          score += it.p;
          popup(dx, ty-48, '+'+it.p, '#0A7A0A');
        } else {
          // Bad item caught ✗ — lose life
          lives--;
          shake = 8;
          popup(dx, ty-48, 'JAAOJ! 🤮', '#CC0000');
          updateUI();
          if (lives <= 0) { gameOver(); ctx.restore(); return; }
        }
        updateUI();
        continue;
      }

      // Fell through bottom
      if (it.y - IR > H) {
        // *** KEY FIX: missing a good item does NOT cost a life ***
        // Just show a small "miss" indicator and remove
        if (it.p > 0) {
          popup(it.x, H-60, 'promašaj…', '#AA7700');
        }
        items.splice(i, 1);
        continue;
      }

      // Draw: glow ring + disc + emoji
      ctx.beginPath();
      ctx.arc(dx, it.y, IR+6, 0, Math.PI*2);
      ctx.fillStyle = it.ring;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(dx, it.y, IR, 0, Math.PI*2);
      ctx.fillStyle = it.bg;
      ctx.fill();

      ctx.font = `${Math.round(IR*1.55)}px serif`;
      ctx.fillText(it.e, dx, it.y+1);

    } else {
      // Caught animation: float up + fade out
      it.alpha -= 0.08;
      it.y -= 4;
      it.scale += 0.05;
      if (it.alpha <= 0) { items.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = it.alpha;
      ctx.translate(it.x, it.y);
      ctx.scale(it.scale, it.scale);
      ctx.font = `${Math.round(IR*1.55)}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.e, 0, 0);
      ctx.restore();
    }
  }

  // Popups
  for (let i=popups.length-1; i>=0; i--) {
    const p = popups[i];
    p.life--; p.y -= 1.2;
    ctx.save();
    ctx.globalAlpha = p.life/70;
    ctx.font = 'bold 20px Comic Sans MS, cursive';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText(p.txt, p.x, p.y);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, p.x, p.y);
    ctx.restore();
    if (p.life <= 0) popups.splice(i, 1);
  }

  // Speed bar (bottom)
  const pct = Math.min((speed-1.1)/4.1, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fillRect(0, H-5, W, 5);
  const bc = pct < 0.4 ? '#27AE60' : pct < 0.72 ? '#F39C12' : '#E74C3C';
  ctx.fillStyle = bc;
  ctx.fillRect(0, H-5, W*pct, 5);

  ctx.restore();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  if (score > highScore) highScore = score;
  document.getElementById('fs').textContent = '⭐ Rezultat: ' + score;
  document.getElementById('ghs').textContent = '🏆 Rekord: ' + highScore;
  document.getElementById('gos').style.display = 'flex';
  document.getElementById('hs-row').textContent = highScore > 0 ? '🏆 Rekord: '+highScore : '';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y); c.arcTo(x+w, y,   x+w, y+r,   r);
  c.lineTo(x+w, y+h-r); c.arcTo(x+w, y+h, x+w-r, y+h, r);
  c.lineTo(x+r, y+h); c.arcTo(x,   y+h, x,   y+h-r, r);
  c.lineTo(x, y+r); c.arcTo(x,   y,   x+r, y,   r);
  c.closePath();
}

// ── Controls ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!running) return;
  const s = 32;
  if (e.key === 'ArrowLeft')  { trayX = Math.max(TW/2, trayX-s); e.preventDefault(); }
  if (e.key === 'ArrowRight') { trayX = Math.min(W-TW/2, trayX+s); e.preventDefault(); }
});

canvas.addEventListener('mousemove', e => {
  if (!running) return;
  const r = canvas.getBoundingClientRect();
  trayX = Math.max(TW/2, Math.min(W-TW/2, (e.clientX-r.left)*(W/r.width)));
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!running) return;
  const r = canvas.getBoundingClientRect();
  trayX = Math.max(TW/2, Math.min(W-TW/2, (e.touches[0].clientX-r.left)*(W/r.width)));
}, { passive: false });
</script>
</body>
</html>
